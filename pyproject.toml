[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-review-agent"
version = "0.1.0"
description = "基于 LangGraph 与 Chroma 的科研文献综述 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.20,<1.0",
    "langchain-text-splitters>=0.3.6,<1.0",
    "langchain-openai>=0.3.7,<1.0",
    "langchain-community>=0.3.18,<1.0",
    "langchain-chroma>=0.2.2,<1.0",
    "langgraph>=0.2.70,<1.0",
    "sentence-transformers>=3.4.1,<6.0",
    "pypdf>=5.3.0,<7.0",
    "rank-bm25>=0.2.2,<1.0",
    "pydantic>=2.10.6,<3.0",
    "pydantic-settings>=2.7.1,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "reportlab>=4.3.1,<5.0",
]

[project.scripts]
lit-review-agent = "lit_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
